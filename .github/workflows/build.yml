name: Build Metrolist APK

on:
  push:
    branches: [ "playback-and-sync" ]
  workflow_dispatch: # Ovo ti omogućava da pokreneš build ručno kad god želiš

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kod
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Dozvoli pokretanje gradlew skripte
      run: chmod +x gradlew

    - name: Spakuj APK
      run: ./gradlew assembleDebug

    - name: Sačuvaj APK kao fajl za preuzimanje
      uses: actions/upload-artifact@v4
      with:
        name: Metrolist-Kosta-Version
        path: app/build/outputs/apk/debug/app-debug.apk